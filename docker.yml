---
- name: Docker Updates
  hosts: "{{ host }}"
  become: true
  vars_files:
    - "vars/vault.yaml"
  gather_facts: false
  vars_prompt:
    - name: host
      prompt: Which host?
      private: false
    - name: containers_to_update
      prompt: Which containers?
      private: false
  tasks:
    - name: Docker Pull
      ansible.builtin.command: "docker compose pull {{ containers_to_update }}"
      args:
        chdir: /home/{{ main_username }}/

    - name: Docker Update
      ansible.builtin.command: "docker compose up -d {{ containers_to_update }}"
      args:
        chdir: /home/{{ main_username }}/

    - name: Docker prune
      ansible.builtin.command: "docker image prune -af"
  roles:
    - role: docker-compose-generator
