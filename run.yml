---
- name: Ubuntu Cleanup
  hosts: all
  become: true
  tasks:
    # Ubuntu
    - name: Set timezone
      community.general.timezone:
        name: "{{ ntp_timezone }}"
      when: ansible_distribution == 'Ubuntu'
    - name: Remove Ubuntu motd spam
      ansible.builtin.file:
        path: "/etc/update-motd.d/{{ item }}"
        state: absent
      loop:
        - 80-livepatch
        - 95-hwe-eol
        - 50-motd-news
        - 10-help-text
        - 88-esm-announce
        - 91-contract-ua-esm-status
      when: ansible_distribution == 'Ubuntu'
    - name: Remove Ubuntu Snap
      ansible.builtin.apt:
        name: snapd
        state: absent
        purge: true
      when: ansible_distribution == 'Ubuntu'
    # Fedora
    - name: Install the rpmfusion and fonts repo packages
      ansible.builtin.dnf:
        state: present
        disable_gpg_check: true
        name:
          - https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts.distribution_version }}.noarch.rpm
          - https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts.distribution_version }}.noarch.rpm
      become: true
      when: ansible_distribution == 'Fedora'
    - name: Improve DNF Performances
      ansible.builtin.blockinfile:
        path: /etc/dnf/dnf.conf
        create: true
        block: |
          [main]
          gpgcheck=1
          installonly_limit=3
          clean_requirements_on_remove=True
          best=False
          skip_if_unavailable=True
          fastestmirror=1
          max_parallel_downloads=10
          deltarpm=true
      become: true
      when: ansible_distribution == 'Fedora'
    - name: Upgrade all packages
      ansible.builtin.dnf: # noqa: package-latest
        name: "*"
        state: latest
      when: ansible_distribution == 'Fedora'

- name: Adonalsium Install
  hosts: adonalsium
  become: true
  vars_files:
    - "vars/vault.yaml"
  pre_tasks:
    - name: Remove enterprise repo
      ansible.builtin.file:
        state: absent
        path: /etc/apt/sources.list.d/pve-enterprise.list
    - name: Install python3-debian for deb822_repository
      ansible.builtin.apt:
        name: python3-debian
        state: present
    - name: Find old community repo list files
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns: "*.list"
        contains: 'download\.proxmox\.com/debian/pve\s+\S+\s+pve-no-subscription'
        use_regex: false
      register: run_old_pve_repo_lists
    - name: Remove old community repo list files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ run_old_pve_repo_lists.files }}"
      loop_control:
        label: "{{ item.path }}"
    - name: Switch to community repo
      ansible.builtin.deb822_repository:
        name: pve-no-subscription
        uris: http://download.proxmox.com/debian/pve
        suites: bookworm
        components: pve-no-subscription
    - name: Apt update
      ansible.builtin.apt:
        upgrade: "yes"
        update_cache: true
        cache_valid_time: 3600
  roles:
    - role: install/nag_removal
    - role: grog.package
    - role: geerlingguy.pip
    - role: install/pip_packages
    - role: geerlingguy.samba
    - role: geerlingguy.nfs
    - role: install/mergerfs
    - role: install/autorestic
    - role: install/runitor
    - role: adonalsium
    - role: cronjobs
    - role: geerlingguy.docker
    - role: geerlingguy.ntp
    - role: install/lnxlink
    - role: install/docker_patch
    - role: docker-compose-generator
    - role: install/chezmoi
    - role: install/snapraid

