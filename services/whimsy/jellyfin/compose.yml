services:
  jellyfin:
    image: ghcr.io/linuxserver/jellyfin:10.11.11
    container_name: jellyfin
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - "{{ appdata_path }}/jellyfin/config:/config"
      - /mnt/scratch/transcode:/transcode
      - /mnt/Media/Movies:/mnt/movies
      - /mnt/Media/UHD:/mnt/UHD
      - /mnt/Media/TV Shows:/mnt/tv
      - /mnt/Media/Kids Movies:/mnt/kids
      - /mnt/Media/Kids TV:/mnt/kids_tv
      - /mnt/Media/YouTube/Kids:/mnt/kids_youtube
      - /mnt/Media/YouTube/Pinchflat:/mnt/pinchflat
      - /mnt/Media/Parents Movies:/mnt/parents_movies
      - /mnt/Media/Parents TV:/mnt/parents_tv
      - /mnt/Media/Family Videos:/mnt/home_videos
    network_mode: host
    environment:
      - UID=1001
      - GID=1001
      - PUID=1001
      - PGID=1001
      - TZ={{ ntp_timezone }}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  press:
    image: ghcr.io/fuzzymistborn/jellyjar/press:0.4.0
    container_name: press
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - "{{ appdata_path }}/press/config:/config"
      - /tmp/jellyjar:/output
      - /mnt/Media/Movies:/mnt/movies
      - /mnt/Media/UHD:/mnt/UHD
      - /mnt/Media/TV Shows:/mnt/tv
      - /mnt/Media/Kids Movies:/mnt/kids
      - /mnt/Media/Kids TV:/mnt/kids_tv
    ports:
      - 8090:8090
    environment:
      - MEDIA_ROOT=/mnt
      - OUTPUT_ROOT=/output
      - CONFIG_ROOT=/config
      - LIBVA_DRIVER_NAME=iHD
      # ENCODER: h264_vaapi     # pin encoder; skips startup probe (h264_nvenc | h264_qsv | h264_vaapi | libx264)
      - MAX_WORKERS=1
      - CLEANUP_AFTER_DAYS=5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

