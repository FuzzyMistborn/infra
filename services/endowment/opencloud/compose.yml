---
services:
  opencloud:
    image: opencloudeu/opencloud-rolling:9.0.0
    container_name: opencloud
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    entrypoint:
      - /bin/sh
    command: ["-c", "opencloud init || true; opencloud server"]
    environment:
    # ── Core ──────────────────────────────────────────────────────────────
      - OC_URL=https://files.{{ secret_personal_url }}
      - OC_LOG_LEVEL=warn

      # ── Embedded services ─────────────────────────────────────────────────
      - OC_ADD_RUN_SERVICES=collaboration

      # ── TLS / reverse proxy ───────────────────────────────────────────────
      # Testing (no proxy): true  — OC generates a self-signed cert
      # Production (Caddy): false — Caddy terminates TLS
      - PROXY_TLS=false
      # Default is false, but `opencloud init` prompts interactively without it
      - OC_INSECURE=false

      # ── Built-in IDM / admin ──────────────────────────────────────────────
      - IDM_ADMIN_PASSWORD={{ secret_openclouud_idm_pass }}

      # ── OIDC / Pocket-ID ──────────────────────────────────────────────────
      # Uncomment this block when ready to switch to Pocket-ID.
      # Also uncomment the proxy.yaml volume mount below.
      # - OC_EXCLUDE_RUN_SERVICES=idp
      # - OC_OIDC_ISSUER=https://id.example.com
      # - WEB_OIDC_CLIENT_ID=opencloud
      # - WEB_OIDC_SCOPE=openid profile email groups offline_access
      # - PROXY_OIDC_REWRITE_WELLKNOWN=true
      # - PROXY_AUTOPROVISION_ACCOUNTS=true
      # - PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD=none
      # - PROXY_ROLE_ASSIGNMENT_DRIVER=oidc
      # - PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM=groups
      # - GRAPH_ASSIGN_DEFAULT_USER_ROLE=false
      # - GRAPH_USERNAME_MATCH=none

      # ── Collabora / WOPI ──────────────────────────────────────────────────
      - COLLABORATION_WOPI_SRC=https://files.{{ secret_personal_url }}
      - COLLABORATION_APP_NAME=CollaboraOnline
      - COLLABORATION_APP_PRODUCT=Collabora
      - COLLABORATION_APP_ADDR=https://collabora.{{ secret_personal_internal_url }}
      - COLLABORATION_APP_ICON=https://collabora.{{ secret_personal_internal_url }}/favicon.ico

      # ── Full-text search (Tika) ───────────────────────────────────────────
      - SEARCH_EXTRACTOR_TYPE=tika
      - SEARCH_EXTRACTOR_TIKA_TIKA_URL=http://tika:9998

      # ── Misc / password policy ────────────────────────────────────────────
      - FRONTEND_ARCHIVER_MAX_SIZE=10000000000
      - PROXY_CSP_CONFIG_FILE_LOCATION=/etc/opencloud/csp.yaml
    volumes:
      - "{{ appdata_path }}/opencloud/etc:/etc/opencloud"
      - "{{ appdata_path }}/opencloud/data:/var/lib/opencloud"
      - /etc/localtime:/etc/localtime:ro
    networks:
      - opencloud-net
    security_opt:
      - no-new-privileges:true

  tika:
    image: apache/tika:4.1.0
    container_name: tika
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx450m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    mem_limit: 700m
    networks:
      - opencloud-net
    security_opt:
      - no-new-privileges:true

networks:
  opencloud-net:
