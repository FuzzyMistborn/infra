services:
  collabora:
    image: collabora/code:26.04.4.1.1
    container_name: collabora
    privileged: true
    cap_add:
      - MKNOD
    ports:
      - 9980:9980
    environment:
      - username=admin
      - password={{ secret_collabora_pw }}
      - aliasgroup1={{ secret_collabora_url }}:443
      - aliasgroup2={{ secret_collabora_url }}:443
      - server_name=office.{{ secret_personal_url }}
      - dictionaries=en_US
      - extra_params=--o:ssl.enable=true --o:ssl.termination=true --o:ssl.ssl_verification=true --o:welcome.enable=false --o:net.frame_ancestors=cloud.{{ secret_personal_internal_url }}
    volumes:
      - "{{ appdata_path }}/collabora/proof_key:/etc/coolwsd/proof_key:ro"
    networks:
      - collabora-net
    mem_limit: 1000M
    memswap_limit: 1000M
    restart: unless-stopped

networks:
  collabora-net:
