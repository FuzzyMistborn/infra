---
services:
  whisperx:
    image: ghcr.io/fuzzymistborn/whisperx-api:main
    container_name: whisperx
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    ports:
      - 8200:8000
    volumes:
      - "{{ appdata_path }}/whisperx/cache:/root/.cache"
    environment:
      - MODEL_TTL_SEC=300
      - HF_TOKEN={{ secret_hf_token }}
      - DIARIZATION_MODEL=pyannote/speaker-diarization-community-1
      - LOCAL_ONLY_MODELS=0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  whisperx-ts:
    image: ghcr.io/tailscale/tailscale:v1.104.7
    container_name: whisperx-ts
    network_mode: service:whisperx
    privileged: true
    cap_add:
      - net_admin
      - sys_module
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - "{{ appdata_path }}/whisperx-ts/config:/config"
      - "{{ appdata_path }}/whisperx-ts/state:/var/lib/tailscale"
    environment:
      - TS_HOSTNAME=whisperx-pa
      - TS_EXTRA_ARGS= --accept-routes
      - TS_ACCEPT_DNS=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    restart: unless-stopped
