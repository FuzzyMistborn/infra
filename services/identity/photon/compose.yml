services:
  photon:
    image: ghcr.io/rtuszik/photon-docker:2.4.0
    container_name: photon
    environment:
      - UPDATE_STRATEGY=SEQUENTIAL
      - UPDATE_INTERVAL=720h
      - REGION=north-america
    volumes:
      - /mnt/external_data/photon:/photon/data
    restart: unless-stopped
    ports:
      - 2322:2322
    networks:
      - dawarich-net
    security_opt:
      - no-new-privileges:true

networks:
  dawarich-net:
