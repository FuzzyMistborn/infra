---
- name: Check whether package is installed
  ansible.builtin.shell: "dpkg-query -W 'pve-fake-subscription'"
  ignore_errors: true
  register: nag_removal_package_check
  changed_when: "nag_removal_package_check.rc != 0"

- name: Install package?
  ansible.builtin.set_fact:
    nag_removal_needs_install: "{{ nag_removal_force_install == true or nag_removal_package_check.failed == true }}"

- name: Get latest release
  ansible.builtin.uri:
    url: https://api.github.com/repos/Jamesits/pve-fake-subscription/releases/latest
    url_username: "{{ github_api_user | default(omit) }}"
    url_password: "{{ github_api_pass | default(omit) }}"
    return_content: true
    force_basic_auth: "{{ github_api_auth | default(omit) }}"
  register: nag_removal_release_latest
  when: nag_removal_ver is undefined and nag_removal_needs_install == True

- name: Set version if not already
  ansible.builtin.set_fact:
    nag_removal_ver: "{{ nag_removal_release_latest.json.tag_name }}"
  when: nag_removal_ver is undefined and nag_removal_needs_install == True

- name: Download release
  when: nag_removal_needs_install == True
  ansible.builtin.get_url:
    url: https://github.com/Jamesits/pve-fake-subscription/releases/download/{{ nag_removal_ver }}/pve-fake-subscription_{{ nag_removal_ver | regex_replace('v')
      }}+git-1_all.deb
    dest: /tmp

- name: Set filename
  ansible.builtin.set_fact:
    nag_removal_file_name: "pve-fake-subscription_{{ nag_removal_ver | regex_replace('v') }}+git-1_all.deb"
  when: nag_removal_needs_install == True

- name: Install deb
  ansible.builtin.apt:
    deb: /tmp/{{ nag_removal_file_name }}
    state: present
  when: nag_removal_needs_install == True
