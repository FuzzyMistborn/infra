---
- name: Apt Update
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Apt Dependencies
  become: true
  ansible.builtin.apt:
    name: "{{ tailscale_apt_dependencies }}"
    state: present

- name: Find old Tailscale list files
  become: true
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    contains: 'pkgs\.tailscale\.com'
    use_regex: false
  register: tailscale_old_repo_lists

- name: Remove old Tailscale list files
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ tailscale_old_repo_lists.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Add Tailscale apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: tailscale
    uris: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}"
    suites: "{{ ansible_distribution_release | lower }}"
    components: main
    signed_by: "{{ tailscale_apt_signkey }}"

- name: Install Tailscale
  become: true
  ansible.builtin.apt:
    name: "{{ tailscale_package }}"
    state: present
    update_cache: true
