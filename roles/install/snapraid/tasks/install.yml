---
- name: Check installed snapraid version
  ansible.builtin.shell: "dpkg-query -W -f='${Version}' snapraid 2>/dev/null || true"
  register: snapraid_installed_version
  changed_when: false

- name: Check installed snapraid-daemon version
  ansible.builtin.shell: "dpkg-query -W -f='${Version}' snapraid-daemon 2>/dev/null || true"
  register: snapraid_daemon_installed_version
  changed_when: false

- name: Get latest snapraid release from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/amadvance/snapraid/releases/latest
    url_username: "{{ github_api_user | default(omit) }}"
    url_password: "{{ github_api_pass | default(omit) }}"
    return_content: true
    force_basic_auth: "{{ github_api_auth | default(omit) }}"
  register: snapraid_latest_release

- name: Get latest snapraid-daemon release from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/amadvance/snapraid-daemon/releases/latest
    url_username: "{{ github_api_user | default(omit) }}"
    url_password: "{{ github_api_pass | default(omit) }}"
    return_content: true
    force_basic_auth: "{{ github_api_auth | default(omit) }}"
  register: snapraid_daemon_latest_release

- name: Set version and arch facts
  ansible.builtin.set_fact:
    snapraid_latest_version: "{{ snapraid_latest_release.json.tag_name | regex_replace('^v', '') }}"
    snapraid_daemon_latest_version: "{{ snapraid_daemon_latest_release.json.tag_name | regex_replace('^v', '') }}"
    snapraid_deb_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"

- name: Determine what needs installing
  ansible.builtin.set_fact:
    snapraid_needs_install: "{{ snapraid_force_install or snapraid_installed_version.stdout != snapraid_latest_version }}"
    snapraid_daemon_needs_install: "{{ snapraid_force_install or snapraid_daemon_installed_version.stdout != snapraid_daemon_latest_version }}"

- name: Create temporary download directory
  ansible.builtin.tempfile:
    state: directory
  register: snapraid_tmpdir
  when: snapraid_needs_install or snapraid_daemon_needs_install

- name: Resolve snapraid deb download url
  ansible.builtin.set_fact:
    snapraid_deb_url: "{{ snapraid_latest_release.json.assets | selectattr('name', 'match', '.*_' + snapraid_deb_arch + '\\.deb$') | map(attribute='browser_download_url')
      | first }}"
  when: snapraid_needs_install

- name: Resolve snapraid-daemon deb download url
  ansible.builtin.set_fact:
    snapraid_daemon_deb_url: "{{ snapraid_daemon_latest_release.json.assets | selectattr('name', 'match', '.*_' + snapraid_deb_arch + '\\.deb$') | map(attribute='browser_download_url')
      | first }}"
  when: snapraid_daemon_needs_install

- name: Download snapraid deb
  ansible.builtin.get_url:
    url: "{{ snapraid_deb_url }}"
    dest: "{{ snapraid_tmpdir.path }}/snapraid.deb"
  when: snapraid_needs_install

- name: Download snapraid-daemon deb
  ansible.builtin.get_url:
    url: "{{ snapraid_daemon_deb_url }}"
    dest: "{{ snapraid_tmpdir.path }}/snapraid-daemon.deb"
  when: snapraid_daemon_needs_install

- name: Install snapraid
  ansible.builtin.command: "dpkg -i {{ snapraid_tmpdir.path }}/snapraid.deb"
  when: snapraid_needs_install

- name: Install snapraid-daemon
  ansible.builtin.command: "dpkg -i --force-confold {{ snapraid_tmpdir.path }}/snapraid-daemon.deb"
  when: snapraid_daemon_needs_install

- name: Clean up temporary download directory
  ansible.builtin.file:
    path: "{{ snapraid_tmpdir.path }}"
    state: absent
  when: (snapraid_needs_install or snapraid_daemon_needs_install) and snapraid_tmpdir.path is defined
