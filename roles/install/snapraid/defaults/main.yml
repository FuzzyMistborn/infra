---
# Installation
snapraid_force_install: false

# snapraid.conf
snapraid_config_path: /etc/snapraid.conf
snapraid_data_disks: []
snapraid_parity_disks: []
snapraid_content_files:
  - /var/snapraid.content
snapraid_config_excludes: []
snapraid_config_hidden_files_enabled: false
snapraid_config_hidden_files: nohidden

# snapraidd.conf - System
snapraid_daemon_config_path: /etc/snapraidd.conf
snapraid_daemon_log_directory: /var/log/snapraid
snapraid_daemon_log_retention_days: 120

# snapraidd.conf - Network & REST API
snapraid_daemon_net_enabled: 1
snapraid_daemon_net_port: "127.0.0.1:7627"
snapraid_daemon_net_acl: ""
snapraid_daemon_net_web_root: commander.zip

# snapraidd.conf - Automation & Maintenance
snapraid_daemon_maintenance_schedule: "02:00"
snapraid_daemon_sync_threshold_deletes: 50
snapraid_daemon_sync_threshold_updates: 100
snapraid_daemon_touch_zero_subseconds: 1
snapraid_daemon_scrub_percentage: 0.7
snapraid_daemon_scrub_older_than: 10

# snapraidd.conf - Disk Monitoring & Power
snapraid_daemon_probe_interval_minutes: 3
snapraid_daemon_spindown_idle_minutes: 15

# snapraidd.conf - Notifications
snapraid_daemon_notify_syslog_enabled: 1
snapraid_daemon_notify_syslog_level: info
snapraid_daemon_notify_differences: 1
snapraid_daemon_notify_result_level: info

# Healthchecks.io-style ping base URL (no /start or /fail suffix).
# When set, the hook script pings /start on task-begin and /fail on
# task-error, and the notify script pings success (or /fail) with the
# task report attached as the ping body - mirroring runitor's behavior.
snapraid_daemon_healthchecks_url: ""

# Email is only forwarded by the notify script for these report levels
# (comma-separated, no spaces). Matches the old snapraid-runner
# "sendon: error" behavior.
snapraid_daemon_notify_email_levels: "error,critical"
snapraid_daemon_mail_from: ""
snapraid_daemon_mail_to: ""

snapraid_daemon_hook_script_path: /usr/local/bin/snapraid-hook.sh
snapraid_daemon_notify_script_path: /usr/local/bin/snapraid-notify.sh

# SMTP credentials - if snapraid_daemon_smtp_host is set, manages /root/.netrc
snapraid_daemon_smtp_host: ""
snapraid_daemon_smtp_user: ""
snapraid_daemon_smtp_password: ""
