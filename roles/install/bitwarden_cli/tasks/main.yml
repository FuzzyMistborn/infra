---
- name: Install dependencies for nodesource repo
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Install python3-debian for deb822_repository
  ansible.builtin.package:
    name: python3-debian
    state: present

- name: Remove old nodesource list file and keyring
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/nodesource.list
    - /etc/apt/keyrings/nodesource.gpg

- name: Add nodesource apt repository
  ansible.builtin.deb822_repository:
    name: nodesource
    uris: "https://deb.nodesource.com/node_{{ bitwarden_cli_nodejs_major_version }}.x"
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

- name: Update apt cache for nodesource repository
  ansible.builtin.apt:
    update_cache: true

- name: Install nodejs
  ansible.builtin.package:
    name: nodejs
    state: present

- name: Install bitwarden cli via npm
  community.general.npm:
    name: "@bitwarden/cli"
    global: true
    state: "{{ 'latest' if bitwarden_cli_download_latest_ver else 'present' }}"
    version: "{{ bitwarden_cli_pinned_ver if not bitwarden_cli_download_latest_ver else omit }}"
