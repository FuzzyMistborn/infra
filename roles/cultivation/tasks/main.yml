---
- name: Create config directories
  ansible.builtin.file:
    path: "/home/{{ main_username }}/{{ item }}"
    state: directory
    owner: "{{ main_username }}"
    group: "{{ main_groupname }}"
  loop:
    - docker
    - docker/diun
    - scripts

#### DIUN
- name: Copy DIUN Config Template
  ansible.builtin.template:
    src: diun_config.yml.j2
    dest: /home/{{ main_username }}/docker/diun/config.yml
    owner: "{{ main_username }}"
    group: "{{ main_username }}"

### Microsoft fonts (mounted into Collabora)
- name: Accept MS core fonts EULA
  ansible.builtin.debconf:
    name: ttf-mscorefonts-installer
    question: msttcorefonts/accepted-mscorefonts-eula
    vtype: select
    value: "true"

- name: Install MS core fonts
  ansible.builtin.apt:
    name: ttf-mscorefonts-installer
    state: present
    update_cache: true
  notify:
    - Rebuild font cache
    - Restart Collabora

### Backup Restore
- name: Create restore script
  ansible.builtin.copy:
    dest: /home/{{ main_username }}/restore.sh
    owner: "{{ main_username }}"
    group: "{{ main_username }}"
    mode: +x
    content: |
      #!/bin/bash
      /usr/local/bin/autorestic restore -f -l docker --from local_docker --to /
  when: pull_backup == true
- name: Run restore script
  ansible.builtin.command: /bin/bash ./restore.sh
  args:
    chdir: "/home/{{ main_username }}"
  when: pull_backup == true
- name: Remove restore script
  ansible.builtin.file:
    path: /home/{{ main_username }}/restore.sh
    state: absent
  when: pull_backup == true
