---
- name: Make sure disks unmounted
  ansible.posix.mount:
    path: "{{ item.path }}"
    state: unmounted
  loop: "{{ data_disks + parity_disks + cifs_mount }}"

- name: Create /mnt points
  ansible.builtin.file:
    dest: "{{ item.path }}"
    state: directory
    owner: nobody
    group: nogroup
    mode: "0777"
  loop: "{{ mergerfs_mount + data_disks + parity_disks + cifs_mount + external_mount }}"

- name: Mount disks
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.source }}"
    fstype: "{{ item.fs }}"
    opts: "{{ item.opts }}"
    # change to 'mounted' to auto mount versus 'present' for just loaded into fstab
    state: mounted
  loop: "{{ data_disks + parity_disks }}"

- name: CIFS mounts to fstab
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.source }}"
    fstype: "{{ item.fs }}"
    opts: "{{ item.opts }}"
    # change to 'mounted' to auto mount versus 'present' for just loaded into fstab
    state: present
  loop: "{{ cifs_mount }}"

- name: Mount mergerfs array
  ansible.posix.mount:
    path: "{{ item.mountpoint }}"
    src: "{{ item.source }}"
    opts: "{{ item.opts }}"
    fstype: "{{ item.fs }}"
    # change to 'mounted' to auto mount versus 'present' for just loaded into fstab
    state: mounted
  loop: "{{ fstab_mergerfs }}"
