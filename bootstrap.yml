### Arch/Fedora
- name: Arch/Fedora Bootstrap
  hosts: arch fedora
  remote_user: "{{ bootstrap_user }}"
  gather_facts: true
  vars_files:
    - "vars/vault.yaml"
  tasks:
    - name: Add ansible user
      ansible.builtin.user:
        name: ansible
        password: "{{ secret_ansible_pass }}"
        uid: 666
        groups:
          - wheel
        system: true
        shell: /bin/bash
    - name: Add sudoers file for ansible
      ansible.builtin.copy:
        src: sudoer_ansible
        dest: /etc/sudoers.d/ansible
        owner: root
        group: root
        mode: "0440"
    - name: Add SSH Keys
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ secret_ansible_ssh }}"
    - name: Add hardened SSH config
      ansible.builtin.copy:
        src: sshd_config
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0600"
    - name: Restart ssh
      ansible.builtin.service:
        name: sshd
        state: restarted

